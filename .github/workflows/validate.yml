name: validate

# The preset shipped two invalid settings unnoticed (`reviewers` as a string,
# `rollbackPrs` inside a `matchUpdateTypes` rule). Renovate reports those as a
# config error in every consuming repo, not here, so validate on every push.
on:
  push:
    branches: ["**"]
    paths: ["*.json", ".github/workflows/validate.yml"]
  workflow_dispatch:

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

env:
  # Pinned: an unpinned `npx renovate` silently resolved to v37 on a Node it
  # did not support, which rejects options the preset uses. Renovate bumps
  # this through customManagers:githubActionsVersions.
  # renovate: datasource=npm depName=renovate
  RENOVATE_VERSION: 44.252.8

jobs:
  renovate-config-validator:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "26"
      - name: Validate the presets
        run: npx --yes --package "renovate@${RENOVATE_VERSION}" renovate-config-validator --strict default.json batch.json renovate.json
